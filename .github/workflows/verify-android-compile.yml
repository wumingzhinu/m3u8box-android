name: verify-android-compile

# Feasibility probe. Answers exactly one question: can N_m3u8DL-RE's Common and
# Parser projects be compiled for net9.0-android with AOT? Nothing is packaged
# yet. If this workflow passes, the app work can proceed on solid ground; if it
# fails, the blocker is known before any app code is written.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NRE_REPO: https://github.com/nilaoda/N_m3u8DL-RE.git

jobs:
  probe:
    name: net9.0-android + AOT
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: pin
        run: |
          PIN=$(grep -oE '[0-9a-f]{40}' .nre-pin)
          echo "commit=$PIN" >> "$GITHUB_OUTPUT"
          echo "Pinned N_m3u8DL-RE commit: $PIN"

      # Cloned in CI rather than vendored or referenced as a submodule.
      # A pinned explicit commit keeps builds reproducible, and it avoids the
      # shallow-clone fetch-pack failures that submodule adds hit on some hosts.
      - name: Clone N_m3u8DL-RE at pinned commit
        run: |
          git clone --filter=blob:none --no-checkout "$NRE_REPO" third_party/N_m3u8DL-RE
          git -C third_party/N_m3u8DL-RE fetch --depth 1 origin "${{ steps.pin.outputs.commit }}"
          git -C third_party/N_m3u8DL-RE checkout --detach "${{ steps.pin.outputs.commit }}"
          test -f third_party/N_m3u8DL-RE/src/N_m3u8DL-RE.Parser/N_m3u8DL-RE.Parser.csproj

      # The SDK and the android workload must be from the same major band.
      #
      # An earlier run installed the 9.0 SDK but the runner resolved commands
      # through 10.0.401, which paired a 10.x SDK with a 10.x android workload
      # while still pulling ILCompiler 9.0.20. The mismatch left the
      # PrivateSdkAssemblies target unmet and AOT failed with:
      #   "The PrivateSdkAssemblies ItemGroup is required for
      #    _ComputeAssembliesToCompileToNative"
      # global.json pins the SDK band so SDK, workload, and ILCompiler agree.
      - name: Show SDK band
        run: |
          dotnet --version
          cat global.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: |
          dotnet workload install android
          echo "--- resolved ---"
          dotnet --version
          dotnet workload list

      # Retarget every upstream project to net9.0.
      #
      # Discovered by glob, not a hardcoded list. An earlier revision named only
      # Common and Parser, so when the engine library was added it kept net10.0
      # and the build failed with NETSDK1045. Enumerating directories means a new
      # project cannot be silently missed again.
      #
      # The sed rewrite is the authoritative mechanism. Directory.Build.props
      # cannot be relied on for this: its Condition is evaluated with the
      # project directory, and getting that expression wrong fails silently
      # rather than erroring, which already cost one failed run.
      - name: Retarget upstream to net9.0
        run: |
          set -euo pipefail
          count=0
          for csproj in third_party/N_m3u8DL-RE/src/*/*.csproj; do
            [ -e "$csproj" ] || continue
            if grep -q '<TargetFramework>net10.0</TargetFramework>' "$csproj"; then
              sed -i 's|<TargetFramework>net10.0</TargetFramework>|<TargetFramework>net9.0</TargetFramework>|' "$csproj"
              echo "retargeted $(basename "$csproj")"
              count=$((count + 1))
            fi
          done
          echo "retargeted $count project(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no upstream project was retargeted; upstream TFM likely changed"
            exit 1
          fi
          echo "--- verify none left on net10.0 ---"
          if grep -l 'net10.0' third_party/N_m3u8DL-RE/src/*/*.csproj; then
            echo "::error::some upstream projects are still on net10.0"
            exit 1
          fi
          grep -H 'TargetFramework' third_party/N_m3u8DL-RE/src/*/*.csproj

      # A retarget that silently failed once already (a Directory.Build.props
      # condition that never matched), and the resulting NU1201 was far from the
      # cause. Keep a cheap assertion, but read it from the project files
      # themselves rather than from `msbuild -pp`.
      #
      # `-pp` was tried first and rejected: its dump ends with literal
      # `$(TargetFramework)` placeholders from imported conditional blocks, so
      # "last assignment wins" picks up a placeholder instead of the resolved
      # value. `-getProperty` is not available on the .NET 9 SDK. The project
      # files are the single source of truth here, since the retarget step
      # above rewrites them directly.
      - name: Assert TFM override took effect
        run: |
          set -uo pipefail
          fail=0
          for csproj in third_party/N_m3u8DL-RE/src/*/*.csproj; do
            [ -e "$csproj" ] || continue
            name=$(basename "$csproj")
            echo "--- $name ---"
            grep -n 'TargetFramework' "$csproj" || true
            if grep -q '<TargetFramework>net10.0</TargetFramework>' "$csproj"; then
              echo "::error::$name is still on net10.0"
              fail=1
            elif ! grep -q '<TargetFramework>net9.0</TargetFramework>' "$csproj"; then
              echo "::error::$name has no net9.0 TargetFramework"
              fail=1
            else
              echo "OK $name -> net9.0"
            fi
          done
          exit $fail

      # Rewrite the engine so it can be consumed as a library. Every edit is
      # asserted inside the script; a silent no-op here would surface much later
      # as an incomprehensible accessibility or missing-type error.
      - name: Prepare upstream engine for library use
        run: |
          chmod +x scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh

      - name: Build probe
        working-directory: verify/Probe
        run: |
          set -o pipefail
          dotnet build -c Release -v normal 2>&1 | tee build.log

      # A plain build is not sufficient evidence for an AOT claim: it does not
      # run the ILCompiler pass that actually trips on unsupported patterns and
      # trimming. The probe therefore publishes, which drives the AOT step.
      - name: Publish probe APK (Mono runtime, no AOT)
        working-directory: verify/Probe
        run: |
          set -o pipefail
          dotnet publish -c Release \
            -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -v normal 2>&1 | tee publish.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Probe result"
            echo
            echo "- pinned upstream: \`${{ steps.pin.outputs.commit }}\`"
            echo "- target: \`net9.0-android\`"
            echo "- runtime identifier: \`android-arm64\`"
            echo
            echo "Warnings that are expected and non-fatal:"
            echo "- \`CA1416\` platform-compatibility warnings, from upstream probing"
            echo "  Windows/Linux/macOS APIs; NoWarn'd in the probe project."
            echo "- \`Spectre.Console\` reaching for a terminal. Android has none,"
            echo "  so its console renderer degrades. Tracked in README."
            echo
            echo "Artifacts:"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la verify/Probe/bin/Release/net9.0-android/*/publish 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "no publish output found" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and publish logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: |
            verify/Probe/build.log
            verify/Probe/publish.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload probe APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: probe-apk
          path: verify/Probe/bin/Release/net9.0-android/*/publish/*.apk
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The app itself. Separate job so a failure here is clearly separated from a
  # regression in the upstream rewrite, which the probe job guards.
  # ---------------------------------------------------------------------------
  app:
    name: app APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: probe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone N_m3u8DL-RE at pinned commit
        run: |
          PIN=$(grep -oE '[0-9a-f]{40}' .nre-pin)
          git clone --filter=blob:none --no-checkout "${{ env.NRE_REPO }}" third_party/N_m3u8DL-RE
          git -C third_party/N_m3u8DL-RE fetch --depth 1 origin "$PIN"
          git -C third_party/N_m3u8DL-RE checkout --detach "$PIN"

      - name: Retarget upstream to net9.0
        run: |
          set -euo pipefail
          count=0
          for csproj in third_party/N_m3u8DL-RE/src/*/*.csproj; do
            [ -e "$csproj" ] || continue
            if grep -q '<TargetFramework>net10.0</TargetFramework>' "$csproj"; then
              sed -i 's|<TargetFramework>net10.0</TargetFramework>|<TargetFramework>net9.0</TargetFramework>|' "$csproj"
              echo "retargeted $(basename "$csproj")"
              count=$((count + 1))
            fi
          done
          [ "$count" -gt 0 ] || { echo "::error::no upstream project retargeted"; exit 1; }

      - name: Prepare upstream engine for library use
        run: |
          chmod +x scripts/prepare-upstream.sh
          ./scripts/prepare-upstream.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build app
        working-directory: src/M3U8Box.App
        run: |
          set -o pipefail
          dotnet build -c Release -v normal 2>&1 | tee build.log

      - name: Publish app APK
        working-directory: src/M3U8Box.App
        run: |
          set -o pipefail
          # No key store: the SDK's debug key signs the release build, which
          # is enough to install and verify. A real release would supply a
          # keystore from the repository secrets.
          dotnet publish -c Release \
            -p:AndroidPackageFormat=apk \
            -v normal 2>&1 | tee publish.log

      - name: Upload app build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: |
            src/M3U8Box.App/build.log
            src/M3U8Box.App/publish.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload app APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          # Both layouts occur depending on the workload version: a
          # RID-scoped publish dir, and a flat one directly under the TFM.
          # Globbing both avoids a green build reported as a failed upload.
          path: |
            src/M3U8Box.App/bin/Release/net9.0-android/*/publish/*.apk
            src/M3U8Box.App/bin/Release/net9.0-android/publish/*.apk
            src/M3U8Box.App/bin/Release/net9.0-android/*.apk
          if-no-files-found: error
          retention-days: 30
